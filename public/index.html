<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeaWar - 海战棋</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lobby Screen -->
  <div id="lobby" class="screen">
    <div class="lobby-content">
      <h1 class="title">SeaWar</h1>
      <p class="subtitle">海战棋 - LAN 多人对战</p>
      <div class="lobby-form">
        <input type="text" id="playerName" placeholder="输入你的名字" maxlength="16">
        <button id="btnCreateRoom" class="btn btn-primary">创建房间</button>
        <div class="join-section">
          <input type="text" id="roomIdInput" placeholder="输入房间号" maxlength="8">
          <button id="btnJoinRoom" class="btn btn-primary">加入房间</button>
        </div>
      </div>
      <div id="roomInfo" class="room-info hidden">
        <p>房间号: <span id="roomIdDisplay"></span></p>
        <p id="roomStatus">等待玩家加入...</p>
        <div id="playerList" class="player-list"></div>
      </div>
    </div>
  </div>

  <!-- Placement Screen -->
  <div id="placement" class="screen hidden">
    <div class="placement-content">
      <h2>摆放你的舰船</h2>
      <div class="placement-main">
        <div class="board-section">
          <div id="placementBoard" class="board"></div>
        </div>
        <div class="palette-section">
          <div id="shipPalette" class="ship-palette">
            <div class="ship-option" data-size="5" draggable="true">
              <span class="ship-label">航母 (5格)</span>
              <div class="ship-preview">
                <div class="ship-cell"></div>
                <div class="ship-cell"></div>
                <div class="ship-cell"></div>
                <div class="ship-cell"></div>
                <div class="ship-cell"></div>
              </div>
            </div>
            <div class="ship-option" data-size="4" draggable="true">
              <span class="ship-label">战列舰 (4格)</span>
              <div class="ship-preview">
                <div class="ship-cell"></div>
                <div class="ship-cell"></div>
                <div class="ship-cell"></div>
                <div class="ship-cell"></div>
              </div>
            </div>
            <div class="ship-option" data-size="3" draggable="true">
              <span class="ship-label">巡洋舰 (3格)</span>
              <div class="ship-preview">
                <div class="ship-cell"></div>
                <div class="ship-cell"></div>
                <div class="ship-cell"></div>
              </div>
            </div>
            <div class="ship-option" data-size="3" draggable="true">
              <span class="ship-label">潜艇 (3格)</span>
              <div class="ship-preview">
                <div class="ship-cell"></div>
                <div class="ship-cell"></div>
                <div class="ship-cell"></div>
              </div>
            </div>
            <div class="ship-option" data-size="2" draggable="true">
              <span class="ship-label">驱逐舰 (2格)</span>
              <div class="ship-preview">
                <div class="ship-cell"></div>
                <div class="ship-cell"></div>
              </div>
            </div>
          </div>
          <div class="placement-controls">
            <button id="btnRotate" class="btn btn-secondary">旋转</button>
            <button id="btnRandom" class="btn btn-secondary">随机摆放</button>
            <button id="btnConfirm" class="btn btn-primary">确认</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Battle Screen -->
  <div id="battle" class="screen hidden">
    <div class="battle-content">
      <div id="turnIndicator" class="turn-indicator">你的回合</div>
      <div id="shellInventory" class="shell-inventory">
        <button class="shell-btn shell-normal selected" data-shell="normal">普通炮弹</button>
        <button class="shell-btn shell-cross" data-shell="cross">十字炮弹</button>
        <button class="shell-btn shell-multi" data-shell="multi">散射炮弹</button>
        <button class="shell-btn shell-nuke" data-shell="nuke">核弹</button>
      </div>
      <div class="boards-container">
        <div class="board-panel">
          <h3>你的海域</h3>
          <div id="myBoard" class="board"></div>
        </div>
        <div class="board-panel">
          <h3>敌方海域</h3>
          <div id="enemyBoard" class="board"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOver" class="screen hidden">
    <div class="gameover-content">
      <h2 id="gameOverResult">胜利!</h2>
      <p id="gameOverReason">你击沉了敌方所有舰船</p>
      <button id="btnPlayAgain" class="btn btn-primary">再来一局</button>
    </div>
  </div>

  <script src="/client.js"></script>
</body>
</html>
